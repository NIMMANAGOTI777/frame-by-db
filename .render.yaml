services:
  - type: web
    name: frame-by-db-api
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm run backend:start
    rootDir: .
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: PORT
        sync: false
